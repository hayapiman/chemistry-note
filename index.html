<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>化学ノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f6;--panel:#fff;--ink:#17214a;--sub:#5a6485;--line:#cdd7e0;--cl:87%;--accent:#2f4bd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--panel:#1b2540;--ink:#e8ecfa;--sub:#9aa5c8;--line:#2c3860;--cl:26%;--accent:#8ea2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a2e;--panel:#1b2540;--ink:#e8ecfa;--sub:#9aa5c8;--line:#2c3860;--cl:26%;--accent:#8ea2ff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:2rem;margin:0;letter-spacing:.04em}
.lead{margin:2px 0 14px;color:var(--sub);font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex:1 1 320px}
.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);flex:1 1 200px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font:inherit;font-size:.8rem;border:2px solid transparent;border-radius:99px;padding:2px 10px;cursor:pointer;color:var(--ink);background:hsl(var(--h) 65% var(--cl))}
.chip[aria-pressed=true]{border-color:var(--ink)}
.scroll{overflow-x:auto;padding-bottom:8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));grid-template-rows:repeat(7,auto) 12px repeat(2,auto);gap:3px;min-width:780px}
.el{font:inherit;border:0;border-radius:4px;padding:2px 0 3px;text-align:center;cursor:pointer;color:var(--ink);background:hsl(var(--h) 65% var(--cl));line-height:1.15}
.el b{display:block;font-size:1.05rem}
.el i{display:block;font-style:normal;font-size:.55rem;opacity:.75}
.el small{font-size:.55rem;display:block;opacity:.8}
.el.dim{opacity:.18}
.el[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px;position:relative}
.card{grid-column:3/13;grid-row:1/4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;gap:16px;align-items:center;min-height:0}
.card .sym{font-family:"Shippori Mincho",serif;font-size:3.6rem;line-height:1;min-width:92px;text-align:center;border-radius:8px;padding:8px 4px;background:hsl(var(--h) 65% var(--cl))}
.card h2{margin:0;font-size:1.25rem}
.card p{margin:2px 0;font-size:.85rem;color:var(--sub)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.item h3{margin:0 0 2px;font-size:1.05rem}
.item .meta{font-size:.8rem;color:var(--sub);margin:0 0 6px}
.item p{margin:4px 0 0;font-size:.92rem;max-width:42em}
.eq{font-family:"Shippori Mincho",serif;font-size:1.25rem;margin:6px 0;overflow-x:auto;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:0 9px;background:hsl(var(--h) 65% var(--cl));margin-right:6px}
.empty{color:var(--sub);padding:24px 0}
footer{max-width:1100px;margin:24px auto;padding:0 16px;color:var(--sub);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s}}
.lab canvas{width:100%;height:auto;display:block;border-radius:10px;background:#0f1830}
.hr{display:grid;grid-template-columns:76px 1fr 120px;gap:8px;align-items:center;width:100%;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 0 4px;color:var(--ink);cursor:pointer;text-align:left}
.hr[aria-pressed=true]{border-color:var(--accent);border-width:2px}
.hb{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.hb i{display:block;height:100%}
.ht{font-size:.85rem;text-align:right;color:var(--sub)}
#hs{width:100%;margin:8px 0}
#dc{width:100%;max-width:400px;height:auto;display:block}

/* Improved visual system */
:root{--shadow:0 10px 28px rgba(19,35,72,.07)}
body{background:radial-gradient(circle at 85% 0%,rgba(86,135,236,.10),transparent 38%),var(--bg)}
header{padding-top:30px}h1{font-size:clamp(2rem,4vw,2.8rem)}
.lead{margin-bottom:20px}.bar{gap:12px}.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tabs button{white-space:nowrap}.utility{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 13px;cursor:pointer}
.item,.card{box-shadow:var(--shadow);border-radius:16px}.item{transition:transform .16s,box-shadow .16s}.item:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,35,72,.12)}
.el{border-radius:6px;transition:transform .12s,filter .12s}.el:hover{transform:scale(1.06);filter:brightness(1.04);z-index:2}
.chip{padding:5px 12px}.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}
.quiz-option{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:13px;border-radius:12px;cursor:pointer}
.quiz-option:disabled{cursor:default;opacity:.8}.quiz-option.correct{border:2px solid #19a76c}.quiz-option.wrong{border:2px solid #e25c66}
.quiz-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:650px){header,main{padding-left:12px;padding-right:12px}.bar{align-items:stretch}.tabs{order:2;flex-basis:100%}.utility{order:0}input[type=search]{order:1}.quiz-options{grid-template-columns:1fr}.card{padding:8px}}

/* Responsive workspace and atom explorer */
:root{--radius:18px}
header,main,footer{max-width:1320px}
header{position:relative}
.lead{max-width:700px}
.bar{background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.tabs{border-bottom:0;gap:5px}
.tabs button{border-radius:10px;border-bottom:0;margin:0;padding:10px 13px}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
#q{border-radius:12px}
.mode-switch{display:flex;gap:5px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mode-switch button{font:inherit;font-size:.84rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.mode-switch button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.pt{min-width:790px;gap:4px}
.el{min-height:48px}
.el:focus-visible{z-index:5}
.card{grid-column:3/13;grid-row:1/4;align-self:stretch}
.atom-panel{margin:16px 0 22px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.atom-layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(260px,1fr);gap:20px;align-items:center}
.atom-stage{min-height:350px;border-radius:18px;background:radial-gradient(circle at 50% 45%,#1c3563,#0a142b 72%);display:grid;place-items:center;overflow:hidden}
.atom-svg{display:block;width:min(100%,430px);height:auto}
.atom-shell{fill:none;stroke:#7694c7;stroke-width:1.3;stroke-dasharray:3 4;opacity:.68}
.atom-electron{fill:#6ee7ff;filter:drop-shadow(0 0 4px #5adfff)}
.atom-proton{fill:#ff6f85}.atom-neutron{fill:#b8c4d7}
.atom-center{fill:#192744;stroke:#b5c9f2;stroke-width:1.5}
.atom-data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.atom-stat{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px}
.atom-stat b{display:block;font-size:1.35rem}
.atom-stat span{font-size:.74rem;color:var(--sub)}
.atom-notice{font-size:.83rem;color:var(--sub);line-height:1.6}
.atom-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.atom-controls button{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 12px;cursor:pointer}
.atom-controls button[aria-pressed=true]{background:var(--accent);color:#fff}
.atom-shell-list{font-weight:700;overflow-wrap:anywhere}
body[data-layout="desktop"] header,body[data-layout="desktop"] main{min-width:790px}
body[data-layout="desktop"]{overflow-x:auto}
body[data-layout="mobile"] header,body[data-layout="mobile"] main{min-width:0}
body[data-layout="mobile"] .bar{display:block}
body[data-layout="mobile"] .tabs{overflow-x:auto;margin:8px 0}
body[data-layout="mobile"] #q{width:100%;margin-top:8px}
body[data-layout="mobile"] .atom-layout{grid-template-columns:1fr}
body[data-layout="mobile"] .atom-stage{min-height:260px}
body[data-layout="mobile"] .atom-panel{padding:12px}
@media(max-width:700px){
 .atom-layout{grid-template-columns:1fr}
 .atom-stage{min-height:260px}
 .atom-panel{padding:12px}
 .atom-data{gap:5px}
 .atom-stat{padding:8px}
 .bar{padding:9px}
 .tabs button{padding:9px 11px;font-size:.85rem}
 .card{gap:8px}
 .card .sym{min-width:65px;font-size:2.8rem}
}
@media(prefers-reduced-motion:reduce){.atom-electron{transition:none}}


/* Linked glossary */
.glossary-head{background:var(--panel);border:1px solid var(--line);padding:20px 24px;border-radius:18px;margin-bottom:14px}
.glossary-head h2{font-size:1.6rem;margin:0}
.glossary-head h2 small{font-size:.8rem;color:var(--sub)}
.glossary-head p{margin:4px 0;color:var(--sub)}
.term-categories{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.term-categories button{font:inherit;font-size:.83rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
.term-categories button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.term-categories small{opacity:.8}
.term-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px}
.term-card{display:flex;flex-direction:column;gap:6px}
.term-category-label{font-size:.73rem;color:var(--accent);font-weight:700}
.term-card h3{margin:0}
.term-card p{margin:0;flex:1}
.term-detail-button{font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:transparent;border:0;text-align:left;padding:8px 0;cursor:pointer;align-self:flex-start}
.term-related{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.term-related h4{margin:0 0 8px}
.related-group{margin:9px 0}
.related-group strong{display:block;font-size:.8rem;margin-bottom:4px;color:var(--sub)}
.related-items{display:flex;flex-wrap:wrap;gap:6px}
.related-link{font:inherit;font-size:.79rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:6px 9px;cursor:pointer}
.related-link:hover{border-color:var(--accent);color:var(--accent)}
.focus-header{margin:8px 0}

.sticky-add,.sticky-actions button{font:inherit;font-size:.83rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:10px;cursor:pointer}
.sticky-add{align-self:flex-start}
.sticky-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.sticky-note{background:#fff3b9;color:#40381f;border:1px solid #e7d58a;border-radius:8px 16px 16px 16px;padding:18px;box-shadow:3px 5px 13px rgba(0,0,0,.09)}
.sticky-note>span{font-size:.76rem;opacity:.7}
.sticky-note h3{margin:4px 0}
.sticky-note p{font-size:.9rem}
.sticky-own{border-top:1px dashed #b7a35a;margin-top:10px;padding-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.sticky-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.sticky-note button{background:#fff9db;color:#40381f;border-color:#d6c47b}
.sticky-editor{padding:10px;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px}
.sticky-editor label{display:block;font-size:.83rem;font-weight:700}
.sticky-editor textarea{font:inherit;display:block;width:100%;resize:vertical;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}

/* Compact top bar and left navigation drawer */
.compact-header{max-width:1320px;padding:14px 18px;margin:0 auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.compact-header h1{font-size:clamp(1.2rem,3.8vw,1.8rem);margin:0;flex:1}
.compact-header #q{display:block;width:100%;max-width:none;box-sizing:border-box;margin:0}
.menu-toggle,.header-theme{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-width:44px;min-height:44px;font-size:1.4rem;cursor:pointer}
.header-theme{font-size:1.15rem}
.menu-backdrop{position:fixed;inset:0;background:rgba(8,16,32,.53);z-index:1000}
.menu-backdrop[hidden]{display:none}
.side-menu{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);max-width:100%;background:var(--panel);color:var(--ink);z-index:1001;box-shadow:8px 0 36px rgba(0,0,0,.17);padding:20px 16px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-110%);transition:transform .22s ease;visibility:hidden}
.menu-open .side-menu{transform:translateX(0);visibility:visible}
body.menu-open{overflow:hidden}
.side-menu-head{display:flex;align-items:center;justify-content:space-between;font-size:1.2rem;margin-bottom:20px}
.side-menu-head button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:42px;height:42px;cursor:pointer}
.side-label{font-size:.76rem;color:var(--sub);font-weight:700;margin:14px 0 8px}
.side-tabs{display:flex;flex-direction:column;gap:5px}
.side-tabs button{display:block;width:100%;padding:12px 14px;text-align:left;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.side-tabs button[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
.side-settings{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.side-settings .mode-switch{display:flex;margin-top:10px}
.side-settings .mode-switch button{font-size:.78rem;padding:7px 10px}
body[data-layout="desktop"] .compact-header{min-width:0}
@media(max-width:700px){.compact-header{padding:10px 12px;margin-bottom:10px}.compact-header #q{font-size:16px}.header-top{margin-bottom:8px}main{padding-top:0}}
@media(prefers-reduced-motion:reduce){.side-menu{transition:none}}

/* Tap-to-expand glossary and researcher cards */
.entry-details{width:100%}
.entry-details>summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;min-height:44px;user-select:none}
.entry-details>summary::-webkit-details-marker{display:none}
.entry-details>summary::marker{content:""}
.entry-details>summary strong{font-size:1.05rem;flex:1}
.term-card .entry-details>summary{flex-wrap:wrap;row-gap:2px}
.term-card .entry-details>summary .term-category-label{flex-basis:100%}
.entry-chevron{font-size:1.35rem;color:var(--sub);transition:transform .15s}
.entry-details[open] .entry-chevron{transform:rotate(180deg)}
.entry-body{padding-top:12px;border-top:1px solid var(--line);margin-top:10px}
.entry-body>p{margin:0 0 12px;line-height:1.7}
.entry-details>summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:5px}
.researcher-card .entry-body .meta{margin-bottom:8px}
@media(prefers-reduced-motion:reduce){.entry-chevron{transition:none}}
.researcher-relations{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.researcher-relations h4{margin:0 0 10px}.glossary-head{padding:14px 18px}.glossary-head h2{margin:0}.element-uses{margin:18px 0;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.uses-heading h2{margin:5px 0 16px;font-size:1.35rem}.uses-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.uses-card{border:1px solid var(--line);background:var(--bg);border-radius:15px;padding:16px}.uses-icon{font-size:1.7rem}.uses-card h3{margin:9px 0;font-size:1.05rem}.uses-card p{line-height:1.7;margin:0}.uses-notice{font-size:.8rem;color:var(--sub);margin:12px 0 0}@media(max-width:600px){.uses-grid{grid-template-columns:1fr}.element-uses{padding:14px}}
.timeline-intro{padding:16px 18px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.timeline-intro h2{margin:0 0 6px}.timeline-intro h2 small{font-size:.65em;color:var(--sub)}
.timeline-intro p{margin:0;color:var(--sub);line-height:1.6}
.timeline-toolbar{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:22px}
.timeline-filters{margin-bottom:14px}.timeline-filters>strong{display:block;margin-bottom:8px}
.timeline-chips{display:flex;gap:7px;flex-wrap:wrap}
.timeline-chips button,.timeline-order button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
.timeline-chips button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}
.timeline-order{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--sub);font-size:.86rem}
.science-timeline{position:relative;margin-left:13px;padding-left:26px;border-left:2px solid var(--line)}
.timeline-event{position:relative;margin:0 0 14px}
.timeline-marker{position:absolute;left:-35px;top:23px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-sizing:border-box}
.timeline-event-card{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.timeline-event-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.timeline-event-top time{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.timeline-kind{font-size:.75rem;color:var(--sub);border:1px solid var(--line);border-radius:100px;padding:3px 9px}
.timeline-event .entry-details>summary strong{font-size:1rem}
.timeline-links{border-top:1px solid var(--line);padding-top:10px}
.timeline-links h4{margin:0 0 9px}
@media(max-width:600px){.timeline-toolbar{padding:12px}.science-timeline{margin-left:8px;padding-left:18px}.timeline-marker{left:-27px}.timeline-event-card{padding:12px}}

/* Unified editorial design system */
:root{--radius-lg:20px;--radius-md:14px;--soft-shadow:0 12px 36px rgba(30,49,90,.055)}
body{background:var(--bg);letter-spacing:.005em}
main{max-width:1160px;padding-bottom:64px}
.compact-header{max-width:1160px;border-radius:0 0 18px 18px;box-shadow:var(--soft-shadow);padding:12px 20px;margin-bottom:20px}
.compact-header h1{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.025em}
.compact-header #q{border-radius:12px;min-height:45px}
button{touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.item,.timeline-event-card,.timeline-toolbar,.timeline-intro,.glossary-head,.element-uses{box-shadow:var(--soft-shadow)}
.item{border-radius:var(--radius-md)}
.timeline-intro,.glossary-head{padding:18px 20px}
.term-card,.researcher-card{transition:border-color .16s,box-shadow .16s}
.term-card:has(details[open]),.researcher-card:has(details[open]){border-color:var(--accent);box-shadow:var(--soft-shadow)}
.entry-details>summary{padding:2px 0}
.entry-details>summary:hover strong{color:var(--accent)}
.home-page{display:grid;gap:26px}
.home-hero{position:relative;overflow:hidden;display:flex;align-items:center;min-height:330px;padding:clamp(24px,5vw,56px);border-radius:26px;background:linear-gradient(125deg,#1c2c65,#3456b8 62%,#466dd1);color:white;isolation:isolate}

/* 2026 visual system: unified learning workspace */
:root{--bg:#f5f7fb;--panel:#fff;--ink:#17233b;--sub:#62728b;--line:#e1e8f1;--accent:#3459d9;--shadow:0 8px 28px rgba(24,42,78,.06);--soft-shadow:0 3px 14px rgba(24,42,78,.045);--ui-radius:18px;--ui-focus:#75a8ff}
:root[data-theme="dark"]{--bg:#0b1322;--panel:#142139;--ink:#eef4ff;--sub:#a5b4cf;--line:#2b3b58;--accent:#91acff;--shadow:0 10px 32px rgba(0,0,0,.18);--soft-shadow:0 4px 16px rgba(0,0,0,.13)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1322;--panel:#142139;--ink:#eef4ff;--sub:#a5b4cf;--line:#2b3b58;--accent:#91acff;--shadow:0 10px 32px rgba(0,0,0,.18);--soft-shadow:0 4px 16px rgba(0,0,0,.13)}}
html{scroll-behavior:smooth;scroll-padding-top:105px}
body{background:radial-gradient(ellipse at 8% 0%,rgba(94,147,238,.075),transparent 34%),radial-gradient(ellipse at 94% 18%,rgba(112,96,214,.055),transparent 34%),var(--bg);font-family:Inter,"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.005em;line-height:1.75}
button,input,select,textarea{font-family:inherit}
button{transition:background-color .18s,border-color .18s,box-shadow .18s,transform .18s}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ui-focus);outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
a{color:var(--accent)}
#main{max-width:1240px;padding:10px clamp(14px,3vw,30px) 40px;min-width:0}
#content{min-width:0;animation:uiContentIn .28s ease-out}
@keyframes uiContentIn{from{opacity:.45;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.compact-header{position:sticky;top:0;z-index:90;max-width:none;margin:0 0 16px;padding:12px max(16px,calc((100vw - 1180px)/2));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:0 3px 20px rgba(20,38,72,.035)}
.header-top{margin-bottom:0;gap:14px}
.compact-header h1{font-family:Inter,"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:1.3rem;font-weight:900;letter-spacing:-.045em}

function atomDraw(){
 const target=$("atomDrawing");if(!target)return;
 const e=EL[sel-1],shells=shellCounts(e.z),cx=220,cy=220;
 const maxR=186,minR=shells.length>5?55:70,step=shells.length>1?(maxR-minR)/(shells.length-1):0;
 let out='<circle class="atom-center" cx="220" cy="220" r="37"/>';
 // The nucleus is a representative cluster, not a spatially accurate nucleon arrangement.
 const protons=e.z,neutrons=Math.max(0,massNumber(e)-e.z),total=protons+neutrons;
 const shown=Math.min(total,34);
 for(let i=0;i<shown;i++){
  const a=i*2.39996,r=5.2*Math.sqrt(i),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
  const proton=i%shown<Math.round(shown*protons/Math.max(1,total));
  out+='<circle class="'+(proton?'atom-proton':'atom-neutron')+'" cx="'+x.toFixed(2)+'" cy="'+y.toFixed(2)+'" r="5.1"/>';
 }
 shells.forEach((count,j)=>{
  const radius=minR+j*step;
  out+='<circle class="atom-shell" cx="220" cy="220" r="'+radius.toFixed(2)+'"/>';
  for(let i=0;i<count;i++){
   const angle=(i/count)*Math.PI*2+atomTime*(.55/(1+j*.18))*(j%2?-1:1);
   out+='<circle class="atom-electron" cx="'+(cx+Math.cos(angle)*radius).toFixed(2)+'" cy="'+(cy+Math.sin(angle)*radius).toFixed(2)+'" r="'+(count>18?3:4.3)+'"/>';
  }
 });
 target.innerHTML=out;
}
function atomStart(){
 cancelAnimationFrame(atomRaf);atomLast=0;
 if(tab!=="pt")return;
 atomDraw();
 if(!atomRunning||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const step=t=>{if(tab!=="pt"||!$("atomDrawing")||!atomRunning)return;if(atomLast)atomTime+=Math.min((t-atomLast)/1000,.05);atomLast=t;atomDraw();atomRaf=requestAnimationFrame(step)};
 atomRaf=requestAnimationFrame(step);
}

function solarInit(){const c=document.getElementById("solarCanvas");if(!c)return;const g=c.getContext("2d"),W=c.width,H=c.height;function frame(now){if(!c.isConnected)return;const dt=solarLast?Math.min(.05,(now-solarLast)/1000):0;solarLast=now;if(solarPlaying)solarTime+=dt*solarSpeed*.24;g.clearRect(0,0,W,H);const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#07152e");bg.addColorStop(1,"#111b3b");g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<110;i++){const x=(i*137.5+31)%W,y=(i*71.7+47)%H;g.fillStyle="rgba(255,255,255,"+(.22+(i%5)*.13)+")";g.fillRect(x,y,i%7===0?2:1,i%7===0?2:1)}const cx=W*.5,cy=H*.52;const orbits=STUDIO_PLANETS.map((p,i)=>95+i*42);g.strokeStyle="#8aace329";g.lineWidth=1;orbits.forEach(r=>{g.beginPath();g.ellipse(cx,cy,r,r*solarTilt,0,0,Math.PI*2);g.stroke()});const glow=g.createRadialGradient(cx,cy,3,cx,cy,60);glow.addColorStop(0,"#fff8bd");glow.addColorStop(.25,"#ffbf5a");glow.addColorStop(1,"#ffb34a00");g.fillStyle=glow;g.beginPath();g.arc(cx,cy,60,0,7);g.fill();g.fillStyle="#ffdb70";g.beginPath();g.arc(cx,cy,17,0,7);g.fill();STUDIO_PLANETS.map((p,i)=>{const a=solarTime*p[2]+i*.9,r=orbits[i];return {i,p,x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r*solarTilt,depth:Math.sin(a)}}).sort((a,b)=>a.depth-b.depth).forEach(o=>{const {i,p,x,y}=o,rr=i===solarSelected?Math.max(7,p[5]*3.1):Math.max(4,p[5]*2.5);g.shadowColor=p[4];g.shadowBlur=i===solarSelected?20:6;g.fillStyle=p[4];g.beginPath();g.arc(x,y,rr,0,7);g.fill();g.shadowBlur=0;if(i===solarSelected){g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.arc(x,y,rr+5,0,7);g.stroke()}g.fillStyle="#e6edff";g.font=(i===solarSelected?"bold ":"")+"13px sans-serif";g.textAlign="center";g.fillText(p[0],x,y-rr-11)});solarRaf=requestAnimationFrame(frame)}solarRaf=requestAnimationFrame(frame);c.onpointerdown=e=>{solarDrag=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(solarDrag){solarTime+=(e.clientX-solarDrag)*.008;solarDrag=e.clientX}};c.onpointerup=()=>solarDrag=0}
function moleculeInit(){const c=document.getElementById("moleculeCanvas");if(!c)return;const g=c.getContext("2d"),colors={H:"#e9f3ff",O:"#ef6373",C:"#4d627d",N:"#538bff"};function frame(now){if(!c.isConnected)return;const dt=moleculeLast?Math.min(.05,(now-moleculeLast)/1000):0;moleculeLast=now;if(moleculePlaying)moleculeAngle+=dt*.35;const W=c.width,H=c.height;g.fillStyle="#0b1730";g.fillRect(0,0,W,H);const m=MOLECULES[moleculeSelected],pts=m[3].map(([el,x,y,z])=>{const a=moleculeAngle,co=Math.cos(a),si=Math.sin(a),X=x*co-z*si,Z=x*si+z*co,cy=Math.cos(a*.63),sy=Math.sin(a*.63),Y=y*cy-Z*sy,D=y*sy+Z*cy,sc=125/(1+D*.12);return {el,x:W/2+X*sc,y:H/2+Y*sc,z:D,r:(el==="H"?19:29)/(1+D*.1)}});g.lineWidth=13;g.lineCap="round";m[4].forEach(([a,b])=>{g.strokeStyle="#91a4c3";g.beginPath();g.moveTo(pts[a].x,pts[a].y);g.lineTo(pts[b].x,pts[b].y);g.stroke()});pts.sort((a,b)=>b.z-a.z).forEach(p=>{const grad=g.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,2,p.x,p.y,p.r);grad.addColorStop(0,"#fff");grad.addColorStop(.22,colors[p.el]);grad.addColorStop(1,"#233653");g.fillStyle=grad;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.fillStyle=p.el==="H"?"#1c3454":"#fff";g.textAlign="center";g.font="bold 15px sans-serif";g.fillText(p.el,p.x,p.y+5)});moleculeRaf=requestAnimationFrame(frame)}moleculeRaf=requestAnimationFrame(frame);let down=null;c.onpointerdown=e=>{down=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(down){moleculeAngle+=(e.clientX-down[0])*.013;down=[e.clientX,e.clientY]}};c.onpointerup=()=>down=null}
function nucleoInit(){const c=document.getElementById("nucleoCanvas");if(!c)return;const g=c.getContext("2d");function frame(now){if(!c.isConnected)return;const dt=nucleoLast?Math.min(.05,(now-nucleoLast)/1000):0;nucleoLast=now;if(nucleoPlaying)nucleoTick+=dt;const W=c.width,H=c.height,s=NUCLEO_STEPS[nucleoSelected],t=(Math.sin(nucleoTick*1.5)+1)/2;g.fillStyle="#0b1730";g.fillRect(0,0,W,H);for(let i=0;i<55;i++){g.fillStyle="#ffffff35";g.fillRect((i*139)%W,(i*71)%H,2,2)}const cx=W/2,cy=H/2;const drawBall=(x,y,r,color)=>{const grad=g.createRadialGradient(x-r*.3,y-r*.35,1,x,y,r);grad.addColorStop(0,"#fff");grad.addColorStop(.22,color);grad.addColorStop(1,"#233a60");g.fillStyle=grad;g.beginPath();g.arc(x,y,r,0,7);g.fill()};const n=nucleoSelected===0?4:nucleoSelected===1?3:2;for(let i=0;i<n;i++){const a=i*Math.PI*2/n+nucleoTick*.18,r=145*(1-t)+28*t;drawBall(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.55,19,s[4][0])}drawBall(cx,cy,18+38*t,s[4][1]);g.textAlign="center";g.fillStyle="#dce9ff";g.font="bold 19px sans-serif";g.fillText(s[0],cx,45);g.font="15px sans-serif";g.fillText(t>.65?"生成物":"反応物が近づく模式図",cx,H-24);nucleoRaf=requestAnimationFrame(frame)}nucleoRaf=requestAnimationFrame(frame)}

const INCIDENT_ARTICLES=[{"id":"demon","title":"デーモンコア――二度の臨界事故が変えた研究現場","year":"1945–1946","place":"アメリカ・ロスアラモス","cat":"核・放射線","lead":"同じプルトニウムの核が、わずか9か月の間に二人の研究者の命を奪った。目に見えない中性子の連鎖反応は、なぜ起きたのか。","sections":[["戦争が終わった後の研究室","1945年8月、第二次世界大戦の終結前後、ロスアラモスでは核兵器に用いるプルトニウムの臨界特性を調べる研究が続いていた。臨界とは、核分裂によって生じた中性子が次の核分裂を引き起こし、連鎖反応が持続できる状態をいう。研究者たちは中性子の振る舞いを測るため、プルトニウムの周囲に中性子を反射する材料を近づけていた。後に「デーモンコア」と呼ばれる核は、当初からその名で呼ばれていたわけではない。"],["最初の事故――1945年8月21日","若い物理学者ハリー・ダリアンは、プルトニウムの核を炭化タングステンのブロックで囲む実験をしていた。ブロックが中性子を核へ戻すと、連鎖反応は起きやすくなる。測定器の反応を見て操作を止めようとした際、ブロックを落としてしまい、核は瞬間的に危険な状態に達した。ダリアンはブロックを取り除いて反応を止めたが、大量の放射線を浴び、25日後に亡くなった。"],["二度目の事故――1946年5月21日","ルイス・スローティンは同じ核を使い、ベリリウム製の半球状の反射体を近づける実演を行っていた。反射体同士が接触しないように、隙間を工具で保つ危険な方法だった。工具が滑って反射体が近づくと、短時間の臨界事故が起きた。スローティンはすぐに反射体を離したが、致死的な放射線量を受け、9日後に死亡した。同席者にも被ばくが生じた。"],["何が危険だったのか","この事故は核爆弾の爆発ではない。問題は、制御されない核分裂の連鎖反応によって、短時間に大量の中性子線やガンマ線が発生したことだった。中性子を反射する材料を近づけると、外へ逃げる中性子の一部が戻り、核分裂を継続させやすくなる。肉眼では危険な境界を判断できないため、手作業で限界に近づく操作そのものが危険だった。"],["事故が残した教訓","二人の死亡事故の後、ロスアラモスでは臨界実験の遠隔操作や安全手順の強化が進んだ。研究者の熟練や注意力だけに頼るのではなく、物理的な距離、装置の設計、操作の制限によって危険を減らす発想が重要になった。科学の歴史には発見だけでなく、安全の仕組みをつくり直した経験も刻まれている。"]],"terms":["核分裂","原子核","中性子","放射能"],"elements":["Pu","Be"],"sources":[["National Museum of Nuclear Science & History","https://ahf.nuclearmuseum.org/ahf/history/atomic-accidents/"],["American Physical Society","https://www.aps.org/apsnews/2014/05/slotin"]]},{"id":"tokai","title":"東海村JCO臨界事故――作業の慣行が安全を越えた日","year":"1999","place":"日本・茨城県東海村","cat":"核・放射線","lead":"核燃料を扱う工場で起きた臨界事故。設備の形、作業手順、組織の管理が重なり、深刻な被ばくを招いた。","sections":[["1999年9月30日の出来事","茨城県東海村の核燃料加工施設で、ウランを含む溶液を扱う作業中に臨界事故が発生した。臨界は原子炉のような大きな設備だけで起きるものではない。核分裂しやすい物質の量や濃度、容器の形、周囲の水などの条件がそろうと、意図しない連鎖反応が生じることがある。"],["容器の形が意味すること","事故では、本来想定されていない方法でウラン溶液が沈殿槽に集められた。溶液が特定の形状の容器にまとまると、中性子が外へ逃げにくくなり、臨界に近づく場合がある。さらに周囲の水が中性子を反射する効果も関係した。見た目にはただの液体を移す作業でも、核物質の場合には容器の形そのものが安全設計の一部となる。"],["長時間続いた連鎖反応","事故後、臨界状態は断続的に約20時間続いた。現場の作業員3人が強い放射線を浴び、うち2人が後に亡くなった。周辺でも被ばくや避難・屋内退避などの対応が必要になった。これは核爆発ではなく、制御できない核分裂反応による放射線事故だった。"],["個人の失敗だけでは説明できない","事故を「作業員が間違えた」とだけ説明すると、本質を見落とす。作業方法が安全上の制約から外れていたこと、手順や教育、監督、設備の管理が十分でなかったことが背景にあった。危険な操作が日常の仕事に入り込んでしまうと、個人が注意していても重大事故につながり得る。"],["現代の安全管理につながる問い","安全な作業とは、作業者が常に正しい判断をすることを前提にしない。誤った操作をしても重大な結果につながりにくい容器設計、物質量の制限、確認の仕組み、異常時の対応が必要になる。東海村の事故は、化学や原子力の知識と同じくらい、組織として安全を維持する仕組みが重要だと示した。"]],"terms":["核分裂","中性子","放射能","原子核"],"elements":["U"],"sources":[["IAEA・事故の教訓","https://pub.iaea.org/MTCD/Publications/PDF/EPR-Lessons%20learned%202012_web.pdf"],["IAEA・1999年年次報告","https://www.iaea.org/sites/default/files/anrep1999_full.pdf"]]},{"id":"bhopal","title":"ボパール化学工場事故――眠る街を襲った有毒ガス","year":"1984","place":"インド・ボパール","cat":"化学工場・ガス","lead":"農薬工場から漏れ出した有毒な化学物質。化学反応の暴走と安全設備の不備は、周辺住民を巻き込む大災害となった。","sections":[["深夜の工場で起きた異常","1984年12月2日から3日にかけての夜、インドのボパールにある農薬工場で、有毒なイソシアン酸メチル（MIC）が大量に漏出した。工場に近い住宅地には多くの住民が暮らしており、就寝中の人々が突然、刺激性の強いガスにさらされた。事故は工場の敷地内にとどまらず、都市の生活そのものを襲った。"],["イソシアン酸メチルとは","MICは農薬の製造に使われていた反応性の高い中間体で、揮発しやすく、人体に強い毒性を示す。水などと反応すると熱が生じるため、保管時の温度・圧力管理が重要になる。事故では貯蔵タンク内の反応が進み、温度と圧力が上昇して安全弁からガスが放出された。タンク内に水が入った経緯など、原因の細部には議論がある。"],["なぜ被害が広がったのか","安全装置が十分に機能しなかったこと、危険な物質が大量に保管されていたこと、工場と住宅地が近接していたことが被害を大きくした。毒性ガスは風に運ばれて市街地へ広がり、呼吸器や目などに深刻な障害を引き起こした。死者数は集計方法や対象期間によって異なり、数千人以上が亡くなったとされる。"],["化学の知識が安全設計になる","化学物質の危険性は「毒かどうか」だけで決まらない。反応熱、蒸気圧、保管量、設備の故障、周囲の人口、警報と避難の仕組みまで含めて考える必要がある。反応を止められる設計や、漏れた場合に拡散を抑える設備は、化学の知識を現実の安全につなげるための重要な要素だ。"],["現在に残る課題","ボパール事故は、産業の利益を享受する社会が、その危険を誰に負わせているのかという問題も突きつけた。工場周辺の住民への情報提供、健康影響の長期的な把握、企業や行政の責任など、事故後も長く議論が続いている。"]],"terms":["化学反応と速度","活性化エネルギー","化学平衡"],"elements":["C","N","O"],"sources":[["英国安全衛生庁 HSE","https://www.hse.gov.uk/comah/sragtech/caseuncarbide84.htm"],["世界保健機関 WHO","https://iris.who.int/bitstream/handle/10665/70570/WHO_SDE_OEH_01.3_eng.pdf?isAllowed=y&sequence=1"]]}];

'<section class="accelerator-panel"><div class="accelerator-heading"><span>02 / THE PRINCIPLE</span><h3>どうやって粒子を加速するの？</h3></div><div class="accelerator-lessons"><article><span>01</span><h4>電場がエネルギーを与える</h4><p>陽子や電子のような電荷をもつ粒子は電場から力を受けます。加速空洞では高周波電場を粒子の到着に同期させ、通過するたびに運動エネルギーを増やします。電圧差Vを電荷qの粒子が通過したときのエネルギー変化の大きさは |qV| です。</p></article><article><span>02</span><h4>磁場が軌道を曲げる</h4><p>磁場は運動する荷電粒子にローレンツ力を及ぼします。速度に垂直な磁力は、理想的には粒子の速さを直接増やさず、進む方向を変えます。曲がり方は粒子の運動量・電荷・磁場の強さによって決まります。</p></article><article><span>03</span><h4>真空とビーム集束</h4><p>粒子が空気の分子と衝突するとビームが失われるため、ビームパイプ内を高真空にします。また四極磁石などで粒子の広がりを抑え、細いビームとして保ちます。</p></article><article><span>04</span><h4>衝突と検出</h4><p>粒子を固定された標的に当てたり、向かい合う2本のビームを衝突させたりします。検出器は衝突後に生じた粒子の飛跡やエネルギーを測定し、物質の性質を調べます。</p></article></div></section>'+
'<section class="accelerator-panel"><div class="accelerator-heading"><span>03 / COMPARE</span><h3>加速器の方式を比較</h3></div><div class="accelerator-table-wrap"><table class="accelerator-table"><thead><tr><th>方式</th><th>粒子の軌道</th><th>エネルギーを増やす方法</th><th>特徴</th></tr></thead><tbody><tr><th>線形加速器</th><td>直線</td><td>複数の加速空洞</td><td>一度通過して加速</td></tr><tr><th>サイクロトロン</th><td>外へ広がるらせん</td><td>電極間の交流電場</td><td>比較的コンパクトな装置もある</td></tr><tr><th>シンクロトロン</th><td>ほぼ一定半径のリング</td><td>周回ごとの高周波加速</td><td>磁場を同期させて高エネルギー化</td></tr></tbody></table></div></section>'+
'<section class="accelerator-panel"><div class="accelerator-heading"><span>04 / REAL WORLD</span><h3>加速器は何に使われる？</h3></div><div class="accelerator-apps"><article><strong>🔬 基礎科学</strong><p>高エネルギー粒子の衝突から素粒子や物質の基本法則を調べる。LHCなど。</p></article><article><strong>🏥 医療</strong><p>電子線やX線による放射線治療、陽子線・重粒子線治療、医療用放射性核種の製造。</p></article><article><strong>🧪 化学・材料</strong><p>電子加速器を利用した材料改質、放射光を利用した結晶構造や化学反応の解析。</p></article><article><strong>🏭 産業・検査</strong><p>滅菌、非破壊検査、半導体製造のイオン注入など。</p></article></div></section>'+
'<section class="accelerator-panel accelerator-reading"><h3>さらに詳しく</h3><p><strong>電子ボルト（eV）とは？</strong> 電荷の大きさが電子1個分の粒子が1ボルトの電位差で得るエネルギーの大きさです。1 MeV は100万 eV、1 GeV は10億 eV、1 TeV は1兆 eV を意味します。</p><p><strong>光速を超えられる？</strong> 質量のある粒子はエネルギーを増やすほど光速に近づきますが、光速には到達しません。高エネルギー領域では速さの増加より運動量やエネルギーの増加が重要になります。</p><p><strong>加速器は放射線を出す？</strong> 高エネルギー粒子が標的や装置に衝突すると二次放射線が発生することがあります。そのため遮へい・インターロック・線量監視などの安全対策が必要です。</p><div class="accelerator-links"><button type="button" data-t="radiation">放射線の種類を学ぶ →</button><button type="button" data-t="timeline">科学年表を見る →</button></div><h4>参考資料</h4><a href="https://home.cern/science/accelerators/how-accelerator-works" target="_blank" rel="noopener noreferrer">CERN：How an accelerator works ↗</a><a href="https://home.cern/science/accelerators/accelerator-complex/" target="_blank" rel="noopener noreferrer">CERN：The accelerator complex ↗</a></section></section>';
}
function acceleratorStop(){cancelAnimationFrame(acceleratorRaf);acceleratorRaf=0}
function acceleratorInit(){
 acceleratorStop();const cv=document.getElementById("acceleratorCanvas");if(!cv)return;const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
 function frame(){if(!document.getElementById("acceleratorCanvas")||tab!=="accelerator")return;ctx.clearRect(0,0,W,H);ctx.fillStyle="#0c1b34";ctx.fillRect(0,0,W,H);
 const t=acceleratorFrame*.018,cy=H*.52,cx=W*.5;
 ctx.lineWidth=2;ctx.font="15px sans-serif";ctx.textAlign="center";
 if(acceleratorMode==="linac"){
  ctx.strokeStyle="#557ca8";ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(42,cy);ctx.lineTo(W-40,cy);ctx.stroke();ctx.setLineDash([]);
  for(let i=0;i<7;i++){let x=110+i*104;ctx.fillStyle="#254b77";ctx.fillRect(x-23,cy-65,46,130);ctx.strokeStyle="#82b4f0";ctx.strokeRect(x-23,cy-65,46,130);ctx.fillStyle="#bddbff";ctx.fillText("RF",x,cy-79)}
  const u=(t*.22)%1,x=38+u*(W-76);ctx.fillStyle="#ffce66";ctx.beginPath();ctx.arc(x,cy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e6f2ff";ctx.fillText("電場で加速 →",W/2,46);
  for(let i=0;i<7;i++){let x=110+i*104;ctx.strokeStyle="rgba(122,204,255,.65)";ctx.beginPath();ctx.moveTo(x-12,cy+30);ctx.lineTo(x+12,cy+30);ctx.stroke();ctx.beginPath();ctx.moveTo(x+12,cy+30);ctx.lineTo(x+4,cy+24);ctx.moveTo(x+12,cy+30);ctx.lineTo(x+4,cy+36);ctx.stroke()}
 }else if(acceleratorMode==="cyclotron"){
  ctx.strokeStyle="#43678e";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,156,Math.PI*.5,Math.PI*1.5);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,156,-Math.PI*.5,Math.PI*.5);ctx.stroke();ctx.fillStyle="#b9d6f5";ctx.fillText("交流電場で加速",cx,46);
  const turns=4.4,theta=t*2.6,r=Math.min(155,16+theta*5.6*(60/acceleratorField));ctx.strokeStyle="rgba(99,177,255,.4)";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<500;i++){const a=i/499*turns*2*Math.PI,rr=Math.min(155,16+a*5.6*(60/acceleratorField));if(i===0)ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));else ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}ctx.stroke();const px=cx+r*Math.cos(theta),py=cy+r*Math.sin(theta);ctx.fillStyle="#ffce66";ctx.beginPath();ctx.arc(px,py,9,0,7);ctx.fill();
 }else{
  ctx.strokeStyle="#4c84c0";ctx.lineWidth=20;ctx.beginPath();ctx.ellipse(cx,cy,285,139,0,0,7);ctx.stroke();ctx.strokeStyle="#a7cfff";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,285,139,0,0,7);ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4,x=cx+285*Math.cos(a),y=cy+139*Math.sin(a);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle="#32648f";ctx.fillRect(-15,-25,30,50);ctx.restore()}ctx.fillStyle="#cde2ff";ctx.fillText("磁場を調整して同じリングを周回",cx,46);const px=cx+285*Math.cos(t*1.5),py=cy+139*Math.sin(t*1.5);ctx.fillStyle="#ffce66";ctx.beginPath();ctx.arc(px,py,10,0,7);ctx.fill();ctx.fillStyle="#9dd3ff";ctx.fillRect(cx-25,cy-14,50,28);ctx.fillStyle="#081b34";ctx.fillText("RF",cx,cy+6);
 }
 ctx.fillStyle="#b4cae6";ctx.textAlign="left";ctx.font="13px sans-serif";ctx.fillText("● 黄色：荷電粒子　　青：装置・電磁場の模式表示",20,H-19);
 if(acceleratorRunning)acceleratorFrame+=acceleratorSpeed;
 acceleratorRaf=requestAnimationFrame(frame);
 }frame();
}


const NUCLEAR_MODES={
fission:{name:"核分裂",subtitle:"重い原子核が分かれる",intro:"ウラン235などの重い原子核が中性子を吸収し、分裂して別の原子核と中性子を生みます。分裂で生じた中性子が次の分裂を起こすと連鎖反応になります。",equation:"²³⁵U + ¹n → ²³⁶U* → ¹⁴¹Ba + ⁹²Kr + 3¹n + エネルギー",note:"これは核分裂生成物の組み合わせの一例です。実際には複数の分裂経路があります。",steps:[["中性子が飛び込む","核分裂しやすいウラン235に中性子が吸収され、励起した複合核ができます。"],["原子核が変形する","不安定な状態になった重い原子核が変形し、2つの比較的軽い核へ分かれます。"],["エネルギーと中性子が出る","分裂片の運動エネルギーや放射線などが生じ、さらに中性子が放出されます。"],["連鎖反応の可能性","新しい中性子が別の核分裂を起こすことがあります。原子炉ではこの連鎖反応を制御します。"]],applications:[["原子力発電","制御された核分裂による熱で蒸気をつくり、タービンと発電機を動かします。"],["研究用原子炉","中性子を利用して材料分析、研究、医療用同位体の製造などを行います。"]],caution:"核分裂では放射性の分裂生成物が生じます。運転停止後も崩壊熱が残るため、冷却と放射線管理が重要です。"},
fusion:{name:"核融合",subtitle:"軽い原子核が結びつく",intro:"軽い原子核どうしが結びつき、より重い原子核をつくる反応です。代表例として重水素と三重水素の反応が研究されています。太陽では主に水素がヘリウムに変わる核融合がエネルギー源です。",equation:"²H + ³H → ⁴He + ¹n + 17.6 MeV",note:"重水素・三重水素（D-T）核融合の例。放出エネルギーの大部分は中性子の運動エネルギーになります。",steps:[["軽い原子核を用意する","重水素（陽子1・中性子1）と三重水素（陽子1・中性子2）などを燃料として考えます。"],["非常に高温にする","正に帯電した原子核どうしの電気的反発を越えて反応しやすくするため、非常に高い温度が必要です。"],["原子核が結びつく","十分に近づいた原子核が強い核力によって結びつき、ヘリウム原子核と中性子が生じます。"],["エネルギーを取り出す","生じた粒子のエネルギーを熱などとして回収する研究が進められています。"]],applications:[["核融合エネルギー研究","トカマクやレーザーを用いて高温プラズマを閉じ込め、エネルギーを取り出す技術を研究しています。"],["恒星のエネルギー","太陽などの恒星では、重力で閉じ込められた高温高密度の物質の内部で核融合が進みます。"]],caution:"核融合も放射線対策が不要というわけではありません。D-T核融合では高エネルギー中性子が発生し、材料の放射化やトリチウムの管理が課題です。"}

let nuclearMode="fission",nuclearPlaying=true,nuclearSpeed=1,nuclearFrame=0,nuclearRaf=0;
function nuclearPage(){

 '<section class="nuclear-panel"><div class="nuclear-eyebrow">01 / INTERACTIVE DEMO</div><h3>原子核の変化を観察する</h3><div class="nuclear-switch">'+Object.entries(NUCLEAR_MODES).map(([k,v])=>'<button type="button" data-nuclear-mode="'+k+'" aria-pressed="'+(k===nuclearMode)+'"><strong>'+v.name+'</strong><small>'+v.subtitle+'</small></button>').join("")+'</div><div class="nuclear-stage"><canvas id="nuclearCanvas" width="860" height="380" role="img" aria-label="'+a.name+'の模式アニメーション"></canvas><p>粒子の色・数・動きは理解を助けるための模式表現です。原子核の実際の大きさや反応時間は再現していません。</p></div><div class="nuclear-controls"><button type="button" data-nuclear-play="1">'+(nuclearPlaying?"一時停止":"再生")+'</button><button type="button" data-nuclear-reset="1">↻ 最初から</button><label>速度 <input type="range" id="nuclearSpeed" min="1" max="4" step="1" value="'+nuclearSpeed+'"><output id="nuclearSpeedValue">'+nuclearSpeed+'×</output></label></div><div class="nuclear-equation"><strong>代表的な反応式</strong><p>'+a.equation+'</p><small>'+a.note+'</small></div></section>'+
 '<section class="nuclear-panel"><div class="nuclear-eyebrow">02 / HOW IT WORKS</div><h3>'+a.name+'はどのように起きる？</h3><p class="nuclear-intro">'+a.intro+'</p><div class="nuclear-steps">'+a.steps.map((x,i)=>'<article><span>'+String(i+1).padStart(2,"0")+'</span><div><h4>'+x[0]+'</h4><p>'+x[1]+'</p></div></article>').join("")+'</div></section>'+
 '<section class="nuclear-panel"><div class="nuclear-eyebrow">03 / ENERGY</div><h3>なぜエネルギーが出るの？</h3><p class="nuclear-intro">原子核を構成する粒子の結びつき方が変わると、反応前後で静止質量の合計に差が生じることがあります。その質量差に相当するエネルギーが、粒子の運動エネルギーなどとして現れます。</p><div class="nuclear-formula">E = Δm c²</div><p class="nuclear-intro">Δm は反応前後の質量差、c は光速です。核子1個あたりの結合エネルギーは鉄やニッケル付近で大きくなるため、非常に重い核の分裂も、軽い核の融合も、条件によってエネルギーを放出できます。</p><div class="nuclear-insight"><strong>重要な注意</strong><p>核分裂も核融合も、すべての反応が必ずエネルギーを放出するわけではありません。どの原子核が反応するかで変わります。</p></div></section>'+

function nuclearStop(){cancelAnimationFrame(nuclearRaf);nuclearRaf=0}
function nuclearInit(){
 nuclearStop();const canvas=document.getElementById("nuclearCanvas");if(!canvas)return;const c=canvas.getContext("2d"),W=canvas.width,H=canvas.height;
 function particle(x,y,r,color){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.fill();c.strokeStyle="rgba(255,255,255,.25)";c.lineWidth=1;c.stroke()}
 function nucleus(x,y,count,scale=1){const rad=7*scale;for(let i=0;i<count;i++){const angle=i*2.39996,dist=Math.sqrt(i)*rad*.82;particle(x+Math.cos(angle)*dist,y+Math.sin(angle)*dist,rad,i%2?"#74b7ff":"#ffb86b")}}
 function frame(){if(tab!=="nuclear"||document.getElementById("nuclearCanvas")!==canvas)return;c.fillStyle="#0c1b34";c.fillRect(0,0,W,H);const phase=(nuclearFrame%300)/300,cy=H/2; c.textAlign="center";c.font="15px sans-serif";c.fillStyle="#d8e9ff";
 if(nuclearMode==="fission"){
  const x=430,y=cy;
  if(phase<.36){nucleus(x,y,86,.95);particle(80+phase/.36*320,y,8,"#f7e69a");c.fillText("中性子を吸収",430,48)}
  else if(phase<.5){nucleus(x,y,86,.95+(.5-phase)*.3);c.fillText("励起した原子核",430,48)}
  else{const p=Math.min(1,(phase-.5)/.35);nucleus(x-p*155,y-p*55,45,.9);nucleus(x+p*155,y+p*55,32,.9);for(let i=0;i<3;i++){let a=(i*2*Math.PI/3)-.5;particle(x+Math.cos(a)*p*230,y+Math.sin(a)*p*130,7,"#f7e69a")}c.fillText("分裂片と中性子が放出される",430,48)}
 }else{
  const p=Math.min(1,phase/.6),d=Math.max(0,200-p*210);if(phase<.6){nucleus(430-d,cy,2,1.3);nucleus(430+d,cy,3,1.3);c.fillText("重水素と三重水素が近づく",430,48)}
  else{const u=Math.min(1,(phase-.6)/.3);nucleus(430-u*105,cy,4,1.3);particle(430+u*200,cy,9,"#f7e69a");c.fillText("ヘリウム4と中性子が生じる",430,48)}
 }
 c.fillStyle="#b4cbe8";c.textAlign="left";c.font="13px sans-serif";c.fillText("● オレンジ：陽子　● 青：中性子　● 黄：放出中性子（模式図）",18,H-20);
 if(nuclearPlaying)nuclearFrame+=nuclearSpeed;
 nuclearRaf=requestAnimationFrame(frame);
 }frame();
}

 }else if(astroMode==="stars"){

 }else{
  const left=75,right=825,top=80,bottom=278;for(let i=0;i<260;i++){const x=left+i*(right-left)/259;const wave=(x-left)/(right-left),hue=Math.round(260-wave*260);ctx.strokeStyle="hsl("+hue+",90%,65%)";ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}
  const dips=[.18,.42,.65,.83];ctx.fillStyle="#071427";dips.forEach((p,i)=>{const x=left+p*(right-left),width=9+(i%2)*7;ctx.globalAlpha=.72;ctx.fillRect(x-width/2,top,width,bottom-top);ctx.globalAlpha=1});
  const x=left+phase*(right-left);ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,top-14);ctx.lineTo(x,bottom+15);ctx.stroke();label("光の波長ごとに吸収の特徴を調べる",450,335);
 }
 if(astroPlaying)astroTick+=astroSpeed;astroRaf=requestAnimationFrame(frame);
 }frame();

function spaceAtlas(){
 const p=SPACE_PLANETS[spacePlanet];
 return '<section class="space-page"><header class="space-banner"><span>SPACE CHEMISTRY ATLAS</span><h2>太陽系・宇宙の化学図鑑</h2><p>惑星の大気、氷衛星、彗星、星間物質を比較して、宇宙に広がる化学の多様性を探ろう。</p></header><section class="space-panel"><span class="space-kicker">01 / SOLAR SYSTEM</span><h3>惑星を選んで化学組成を比較</h3><div class="space-planets">'+SPACE_PLANETS.map((x,i)=>'<button type="button" data-space-planet="'+i+'" aria-pressed="'+(spacePlanet===i)+'"><span class="space-planet-dot" style="background:'+x[4]+'"></span>'+x[0]+'</button>').join("")+'</div><div class="space-feature"><div class="space-planet-art"><div class="space-globe" id="planetGlobe" style="--planet-color:'+p[4]+'"></div>'+(spacePlanet===5?'<span class="planet-ring" aria-hidden="true"></span>':'')+'</div><div><span class="space-kicker">'+p[1]+'</span><h3>'+p[0]+'</h3><strong>'+p[2]+'</strong><p>'+p[3]+'</p><small>太陽からの平均距離：約 '+p[5]+' AU（1 AU ≈ 地球と太陽の平均距離）</small></div></div><p class="space-footnote">組成は学習用に概略化しています。惑星の大気は高度・観測条件によって異なります。水星はほぼ真空のため他の惑星の大気と直接比較できません。</p></section>'+spaceMoonsSection()+'<section class="space-panel"><span class="space-kicker">03 / OTHER WORLDS</span><h3>惑星以外にも化学の世界がある</h3><div class="space-worlds">'+SPACE_WORLDS.map(w=>'<article><small>'+w[1]+'</small><h4>'+w[0]+'</h4><p>'+w[2]+'</p><div>注目する物質：'+w[3]+'</div></article>').join("")+'</div></section><section class="space-panel"><h3>関連学習</h3><div class="space-links"><button type="button" data-t="spacelab">宇宙アニメーション実験 →</button><button type="button" data-t="astro">宇宙と化学 →</button><button type="button" data-t="gl">用語辞典 →</button></div><p class="space-footnote">参考：<a href="https://science.nasa.gov/solar-system/planets/" target="_blank" rel="noopener noreferrer">NASA 惑星の解説</a> / <a href="https://science.nasa.gov/solar-system/" target="_blank" rel="noopener noreferrer">NASA 太陽系の解説</a></p></section></section>';
}
const SPACE_LABS={
orbits:["惑星の公転","太陽の周囲を惑星が公転する模式図。内側と外側で周期が大きく異なります。","軌道の距離・大きさ・速度は実際の縮尺ではありません。"],
transit:["系外惑星のトランジット","惑星が恒星の手前を横切ると恒星の光が少し暗くなります。光度曲線の谷を観察しましょう。","光度曲線は説明用の模式的なものです。実測値ではありません。"],
comet:["彗星の昇華と尾","彗星が太陽に近づくと氷が昇華し、気体や塵が放出されます。太陽風と太陽光の作用で尾が形成されます。","尾の方向や長さは単純化した模式表現です。"],
cloud:["分子雲と星の誕生","ガスと塵の集まりが重力で収縮し、密度が高くなった領域から星が生まれます。","星形成は複雑で、単純な粒子の集合だけで表せるものではありません。"],
greenhouse:["惑星の温室効果","可視光が地表を温め、地表から出る赤外線の一部を大気が吸収・再放射します。","大気による放射伝達を簡略化した模式図です。温度や吸収率を計算するものではありません。"]
};
function spaceLab(){
 const a=SPACE_LABS[spaceLabMode];
 return '<section class="space-page"><header class="space-banner"><span>INTERACTIVE SPACE LAB</span><h2>宇宙のしくみを動かして学ぶ</h2><p>公転・系外惑星・彗星・分子雲・温室効果。5種類のアニメーションを切り替えて観察できます。</p></header><section class="space-panel"><div class="space-lab-tabs">'+Object.entries(SPACE_LABS).map(([k,v])=>'<button type="button" data-space-lab="'+k+'" aria-pressed="'+(spaceLabMode===k)+'">'+v[0]+'</button>').join("")+'</div><div class="space-canvas-wrap"><canvas id="spaceCanvas" width="900" height="420" role="img" aria-label="'+a[0]+'の模式アニメーション"></canvas></div><div class="space-controls"><button type="button" data-space-play="1">'+(spacePlay?"一時停止":"再生")+'</button><button type="button" data-space-reset="1">↻ 最初から</button><label>速度 <input id="spaceSpeed" type="range" min="1" max="4" step="1" value="'+spaceSpeed+'"><output id="spaceSpeedValue">'+spaceSpeed+'×</output></label></div><h3>'+a[0]+'</h3><p class="space-description">'+a[1]+'</p><p class="space-footnote">'+a[2]+'</p></section><section class="space-panel"><h3>もっと調べる</h3><div class="space-links"><button type="button" data-t="spaceatlas">惑星・衛星の化学図鑑 →</button><button type="button" data-t="astro">元素の起源と分光 →</button><button type="button" data-t="formulas">化学の公式 →</button></div></section></section>';
}
function spaceStop(){cancelAnimationFrame(spaceRaf);spaceRaf=0}
function spaceInit(){
 spaceStop();const cv=document.getElementById("spaceCanvas");if(!cv)return;const c=cv.getContext("2d"),w=cv.width,h=cv.height;
 function dot(x,y,r,col){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.fill()}
 function line(x,y,X,Y,col,width=2){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=col;c.lineWidth=width;c.stroke()}
 function label(t,x,y,size=15){c.fillStyle="#e5edff";c.font=size+"px sans-serif";c.textAlign="center";c.fillText(t,x,y)}
 function frame(){
  if(tab!=="spacelab"||document.getElementById("spaceCanvas")!==cv)return;
  c.fillStyle="#071426";c.fillRect(0,0,w,h);const t=spaceFrame/70,phase=(spaceFrame%480)/480;
  for(let i=0;i<75;i++)dot((i*167)%w,(i*113)%h,1,"#426182");
  if(spaceLabMode==="orbits"){
   dot(450,205,31,"#ffca65");const rs=[70,112,160,208],cols=["#d9b18d","#75c8e6","#d37b61","#c6b5a0"];rs.forEach((r,i)=>{c.beginPath();c.ellipse(450,205,r,r*.72,0,0,Math.PI*2);c.strokeStyle="#395273";c.lineWidth=1;c.stroke();const a=t/(1+i*1.7)+i*1.2;dot(450+Math.cos(a)*r,205+Math.sin(a)*r*.72,7+i*2,cols[i])});label("太陽と惑星の公転（縮尺は模式的）",450,390)
  }else if(spaceLabMode==="transit"){
   dot(260,175,95,"#ffcd75");const x=60+phase*400;dot(x,175,19,"#172b4d");label("惑星が恒星の手前を通過",260,315);
   line(525,305,860,305,"#8aa6c9");line(525,70,525,305,"#8aa6c9");c.beginPath();for(let i=0;i<=300;i++){const q=i/300,brightness=1-(q>.32&&q<.68?.06:0),y=85+(1-brightness)*1900;if(i===0)c.moveTo(540,y);else c.lineTo(540+i,y)}c.strokeStyle="#76d6ff";c.lineWidth=3;c.stroke();dot(540+phase*300,85+(phase>.32&&phase<.68?114:0),5,"#fff");label("光度（模式図）",690,55);label("時間 →",705,335)
  }else if(spaceLabMode==="comet"){
   dot(135,210,58,"#ffce72");const x=500+Math.cos(t*.35)*85,y=205+Math.sin(t*.35)*60;for(let i=0;i<34;i++){const d=(i*29+spaceFrame*.9)%230;dot(x+d,y+Math.sin(i*2.3+t)*d*.22,2+(i%4),i%2?"#83d5ff":"#dfd1a0")}dot(x,y,22,"#c3d5ed");label("太陽",135,300);label("彗星（氷・塵）",x,150);label("太陽から離れる方向に尾が伸びる",550,355)
  }else if(spaceLabMode==="cloud"){
   const shrink=.95-.55*(.5+.5*Math.sin(t*.22));for(let i=0;i<150;i++){const a=i*2.399+Math.sin(t*.1+i)*.1,r=Math.sqrt(i/150)*210*shrink;dot(450+Math.cos(a)*r*1.7,205+Math.sin(a)*r,2+(i%3),i%5?"#86a9df":"#ffdca4")}dot(450,205,11+(1-shrink)*17,"#ffe0a1");label("ガス・塵が重力で集まる",450,385)
  }else{
   c.fillStyle="#356d9a";c.fillRect(120,275,660,35);c.fillStyle="rgba(126,190,245,.13)";c.fillRect(120,115,660,160);label("大気（赤外線を吸収・再放射）",450,95);label("地表",450,335);
   for(let i=0;i<5;i++){const x=180+i*120,p=(phase*2+i*.2)%1;line(x,125,x+55,270,"#ffe18a",3);line(x+55,270,x+55-25*p,270-135*p,"#ff9a75",3);line(x+55-25*p,270-135*p,x+85,265,"#ff9a75",1)}
   label("黄色：太陽光　赤：赤外線（模式図）",450,390)
  }
  if(spacePlay)spaceFrame+=spaceSpeed;spaceRaf=requestAnimationFrame(frame)
 }frame();
}

$("menuClose").addEventListener("click",closeMenu);
$("menuBackdrop").addEventListener("click",closeMenu);
document.addEventListener("keydown",ev=>{
 if(ev.key==="Escape"&&menuOpen){closeMenu();return}
 if(ev.key==="Tab"&&menuOpen){
  const items=[...$("sideMenu").querySelectorAll('button:not([disabled]),a[href],input:not([disabled])')];
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
  else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
 }
});

themeLabel();applyLayout();draw();
</script>
</body>
</html>
