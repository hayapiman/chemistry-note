<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>化学ノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f6;--panel:#fff;--ink:#17214a;--sub:#5a6485;--line:#cdd7e0;--cl:87%;--accent:#2f4bd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--panel:#1b2540;--ink:#e8ecfa;--sub:#9aa5c8;--line:#2c3860;--cl:26%;--accent:#8ea2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a2e;--panel:#1b2540;--ink:#e8ecfa;--sub:#9aa5c8;--line:#2c3860;--cl:26%;--accent:#8ea2ff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:2rem;margin:0;letter-spacing:.04em}
.lead{margin:2px 0 14px;color:var(--sub);font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex:1 1 320px}
.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
input[type=search]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);flex:1 1 200px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font:inherit;font-size:.8rem;border:2px solid transparent;border-radius:99px;padding:2px 10px;cursor:pointer;color:var(--ink);background:hsl(var(--h) 65% var(--cl))}
.chip[aria-pressed=true]{border-color:var(--ink)}
.scroll{overflow-x:auto;padding-bottom:8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));grid-template-rows:repeat(7,auto) 12px repeat(2,auto);gap:3px;min-width:780px}
.el{font:inherit;border:0;border-radius:4px;padding:2px 0 3px;text-align:center;cursor:pointer;color:var(--ink);background:hsl(var(--h) 65% var(--cl));line-height:1.15}
.el b{display:block;font-size:1.05rem}
.el i{display:block;font-style:normal;font-size:.55rem;opacity:.75}
.el small{font-size:.55rem;display:block;opacity:.8}
.el.dim{opacity:.18}
.el[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px;position:relative}
.card{grid-column:3/13;grid-row:1/4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;gap:16px;align-items:center;min-height:0}
.card .sym{font-family:"Shippori Mincho",serif;font-size:3.6rem;line-height:1;min-width:92px;text-align:center;border-radius:8px;padding:8px 4px;background:hsl(var(--h) 65% var(--cl))}
.card h2{margin:0;font-size:1.25rem}
.card p{margin:2px 0;font-size:.85rem;color:var(--sub)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.item h3{margin:0 0 2px;font-size:1.05rem}
.item .meta{font-size:.8rem;color:var(--sub);margin:0 0 6px}
.item p{margin:4px 0 0;font-size:.92rem;max-width:42em}
.eq{font-family:"Shippori Mincho",serif;font-size:1.25rem;margin:6px 0;overflow-x:auto;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:0 9px;background:hsl(var(--h) 65% var(--cl));margin-right:6px}
.empty{color:var(--sub);padding:24px 0}
footer{max-width:1100px;margin:24px auto;padding:0 16px;color:var(--sub);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s}}
.lab canvas{width:100%;height:auto;display:block;border-radius:10px;background:#0f1830}
.hr{display:grid;grid-template-columns:76px 1fr 120px;gap:8px;align-items:center;width:100%;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 0 4px;color:var(--ink);cursor:pointer;text-align:left}
.hr[aria-pressed=true]{border-color:var(--accent);border-width:2px}
.hb{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.hb i{display:block;height:100%}
.ht{font-size:.85rem;text-align:right;color:var(--sub)}
#hs{width:100%;margin:8px 0}
#dc{width:100%;max-width:400px;height:auto;display:block}

/* Improved visual system */
:root{--shadow:0 10px 28px rgba(19,35,72,.07)}
body{background:radial-gradient(circle at 85% 0%,rgba(86,135,236,.10),transparent 38%),var(--bg)}
header{padding-top:30px}h1{font-size:clamp(2rem,4vw,2.8rem)}
.lead{margin-bottom:20px}.bar{gap:12px}.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tabs button{white-space:nowrap}.utility{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 13px;cursor:pointer}
.item,.card{box-shadow:var(--shadow);border-radius:16px}.item{transition:transform .16s,box-shadow .16s}.item:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,35,72,.12)}
.el{border-radius:6px;transition:transform .12s,filter .12s}.el:hover{transform:scale(1.06);filter:brightness(1.04);z-index:2}
.chip{padding:5px 12px}.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}
.quiz-option{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:13px;border-radius:12px;cursor:pointer}
.quiz-option:disabled{cursor:default;opacity:.8}.quiz-option.correct{border:2px solid #19a76c}.quiz-option.wrong{border:2px solid #e25c66}
.quiz-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:650px){header,main{padding-left:12px;padding-right:12px}.bar{align-items:stretch}.tabs{order:2;flex-basis:100%}.utility{order:0}input[type=search]{order:1}.quiz-options{grid-template-columns:1fr}.card{padding:8px}}

/* Responsive workspace and atom explorer */
:root{--radius:18px}
header,main,footer{max-width:1320px}
header{position:relative}
.lead{max-width:700px}
.bar{background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.tabs{border-bottom:0;gap:5px}
.tabs button{border-radius:10px;border-bottom:0;margin:0;padding:10px 13px}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
#q{border-radius:12px}
.mode-switch{display:flex;gap:5px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mode-switch button{font:inherit;font-size:.84rem;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.mode-switch button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.pt{min-width:790px;gap:4px}
.el{min-height:48px}
.el:focus-visible{z-index:5}
.card{grid-column:3/13;grid-row:1/4;align-self:stretch}
.atom-panel{margin:16px 0 22px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.atom-layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(260px,1fr);gap:20px;align-items:center}
.atom-stage{min-height:350px;border-radius:18px;background:radial-gradient(circle at 50% 45%,#1c3563,#0a142b 72%);display:grid;place-items:center;overflow:hidden}
.atom-svg{display:block;width:min(100%,430px);height:auto}
.atom-shell{fill:none;stroke:#7694c7;stroke-width:1.3;stroke-dasharray:3 4;opacity:.68}
.atom-electron{fill:#6ee7ff;filter:drop-shadow(0 0 4px #5adfff)}
.atom-proton{fill:#ff6f85}.atom-neutron{fill:#b8c4d7}
.atom-center{fill:#192744;stroke:#b5c9f2;stroke-width:1.5}
.atom-data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.atom-stat{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px}
.atom-stat b{display:block;font-size:1.35rem}
.atom-stat span{font-size:.74rem;color:var(--sub)}
.atom-notice{font-size:.83rem;color:var(--sub);line-height:1.6}
.atom-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.atom-controls button{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 12px;cursor:pointer}
.atom-controls button[aria-pressed=true]{background:var(--accent);color:#fff}
.atom-shell-list{font-weight:700;overflow-wrap:anywhere}
body[data-layout="desktop"] header,body[data-layout="desktop"] main{min-width:790px}
body[data-layout="desktop"]{overflow-x:auto}
body[data-layout="mobile"] header,body[data-layout="mobile"] main{min-width:0}
body[data-layout="mobile"] .bar{display:block}
body[data-layout="mobile"] .tabs{overflow-x:auto;margin:8px 0}
body[data-layout="mobile"] #q{width:100%;margin-top:8px}
body[data-layout="mobile"] .atom-layout{grid-template-columns:1fr}
body[data-layout="mobile"] .atom-stage{min-height:260px}
body[data-layout="mobile"] .atom-panel{padding:12px}
@media(max-width:700px){
 .atom-layout{grid-template-columns:1fr}
 .atom-stage{min-height:260px}
 .atom-panel{padding:12px}
 .atom-data{gap:5px}
 .atom-stat{padding:8px}
 .bar{padding:9px}
 .tabs button{padding:9px 11px;font-size:.85rem}
 .card{gap:8px}
 .card .sym{min-width:65px;font-size:2.8rem}
}
@media(prefers-reduced-motion:reduce){.atom-electron{transition:none}}


/* Linked glossary */
.glossary-head{background:var(--panel);border:1px solid var(--line);padding:20px 24px;border-radius:18px;margin-bottom:14px}
.glossary-head h2{font-size:1.6rem;margin:0}
.glossary-head h2 small{font-size:.8rem;color:var(--sub)}
.glossary-head p{margin:4px 0;color:var(--sub)}
.term-categories{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.term-categories button{font:inherit;font-size:.83rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--panel);color:var(--ink);cursor:pointer}
.term-categories button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.term-categories small{opacity:.8}
.term-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px}
.term-card{display:flex;flex-direction:column;gap:6px}
.term-category-label{font-size:.73rem;color:var(--accent);font-weight:700}
.term-card h3{margin:0}
.term-card p{margin:0;flex:1}
.term-detail-button{font:inherit;font-size:.85rem;font-weight:700;color:var(--accent);background:transparent;border:0;text-align:left;padding:8px 0;cursor:pointer;align-self:flex-start}
.term-related{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.term-related h4{margin:0 0 8px}
.related-group{margin:9px 0}
.related-group strong{display:block;font-size:.8rem;margin-bottom:4px;color:var(--sub)}
.related-items{display:flex;flex-wrap:wrap;gap:6px}
.related-link{font:inherit;font-size:.79rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:6px 9px;cursor:pointer}
.related-link:hover{border-color:var(--accent);color:var(--accent)}
.focus-header{margin:8px 0}

.sticky-add,.sticky-actions button{font:inherit;font-size:.83rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:10px;cursor:pointer}
.sticky-add{align-self:flex-start}
.sticky-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.sticky-note{background:#fff3b9;color:#40381f;border:1px solid #e7d58a;border-radius:8px 16px 16px 16px;padding:18px;box-shadow:3px 5px 13px rgba(0,0,0,.09)}
.sticky-note>span{font-size:.76rem;opacity:.7}
.sticky-note h3{margin:4px 0}
.sticky-note p{font-size:.9rem}
.sticky-own{border-top:1px dashed #b7a35a;margin-top:10px;padding-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.sticky-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.sticky-note button{background:#fff9db;color:#40381f;border-color:#d6c47b}
.sticky-editor{padding:10px;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px}
.sticky-editor label{display:block;font-size:.83rem;font-weight:700}
.sticky-editor textarea{font:inherit;display:block;width:100%;resize:vertical;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}

/* Compact top bar and left navigation drawer */
.compact-header{max-width:1320px;padding:14px 18px;margin:0 auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.compact-header h1{font-size:clamp(1.2rem,3.8vw,1.8rem);margin:0;flex:1}
.compact-header #q{display:block;width:100%;max-width:none;box-sizing:border-box;margin:0}
.menu-toggle,.header-theme{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-width:44px;min-height:44px;font-size:1.4rem;cursor:pointer}
.header-theme{font-size:1.15rem}
.menu-backdrop{position:fixed;inset:0;background:rgba(8,16,32,.53);z-index:1000}
.menu-backdrop[hidden]{display:none}
.side-menu{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);max-width:100%;background:var(--panel);color:var(--ink);z-index:1001;box-shadow:8px 0 36px rgba(0,0,0,.17);padding:20px 16px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-110%);transition:transform .22s ease;visibility:hidden}
.menu-open .side-menu{transform:translateX(0);visibility:visible}
body.menu-open{overflow:hidden}
.side-menu-head{display:flex;align-items:center;justify-content:space-between;font-size:1.2rem;margin-bottom:20px}
.side-menu-head button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:42px;height:42px;cursor:pointer}
.side-label{font-size:.76rem;color:var(--sub);font-weight:700;margin:14px 0 8px}
.side-tabs{display:flex;flex-direction:column;gap:5px}
.side-tabs button{display:block;width:100%;padding:12px 14px;text-align:left;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.side-tabs button[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
.side-settings{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.side-settings .mode-switch{display:flex;margin-top:10px}
.side-settings .mode-switch button{font-size:.78rem;padding:7px 10px}
body[data-layout="desktop"] .compact-header{min-width:0}
@media(max-width:700px){.compact-header{padding:10px 12px;margin-bottom:10px}.compact-header #q{font-size:16px}.header-top{margin-bottom:8px}main{padding-top:0}}
@media(prefers-reduced-motion:reduce){.side-menu{transition:none}}

/* Tap-to-expand glossary and researcher cards */
.entry-details{width:100%}
.entry-details>summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;min-height:44px;user-select:none}
.entry-details>summary::-webkit-details-marker{display:none}
.entry-details>summary::marker{content:""}
.entry-details>summary strong{font-size:1.05rem;flex:1}
.term-card .entry-details>summary{flex-wrap:wrap;row-gap:2px}
.term-card .entry-details>summary .term-category-label{flex-basis:100%}
.entry-chevron{font-size:1.35rem;color:var(--sub);transition:transform .15s}
.entry-details[open] .entry-chevron{transform:rotate(180deg)}
.entry-body{padding-top:12px;border-top:1px solid var(--line);margin-top:10px}
.entry-body>p{margin:0 0 12px;line-height:1.7}
.entry-details>summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:5px}
.researcher-card .entry-body .meta{margin-bottom:8px}
@media(prefers-reduced-motion:reduce){.entry-chevron{transition:none}}
.researcher-relations{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.researcher-relations h4{margin:0 0 10px}.glossary-head{padding:14px 18px}.glossary-head h2{margin:0}.element-uses{margin:18px 0;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.uses-heading h2{margin:5px 0 16px;font-size:1.35rem}.uses-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.uses-card{border:1px solid var(--line);background:var(--bg);border-radius:15px;padding:16px}.uses-icon{font-size:1.7rem}.uses-card h3{margin:9px 0;font-size:1.05rem}.uses-card p{line-height:1.7;margin:0}.uses-notice{font-size:.8rem;color:var(--sub);margin:12px 0 0}@media(max-width:600px){.uses-grid{grid-template-columns:1fr}.element-uses{padding:14px}}</style>
</head>
<body>
<header class="compact-header">
  <div class="header-top"><button id="menuToggle" class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="sideMenu"><span>☰</span></button><h1>化学ノート</h1><button id="themeQuick" class="header-theme" type="button" aria-label="ダークモード切替">☾</button></div>
  <input type="search" id="q" placeholder="名前・記号・キーワードで検索" aria-label="検索">
</header>
<div id="menuBackdrop" class="menu-backdrop" hidden></div>
<aside id="sideMenu" class="side-menu" aria-label="メインメニュー" aria-hidden="true" inert>
 <div class="side-menu-head"><strong>メニュー</strong><button id="menuClose" type="button" aria-label="メニューを閉じる">✕</button></div>
 <p class="side-label">学習コンテンツ</p><nav id="tabs" class="side-tabs" aria-label="コンテンツ切替"></nav>
 <div class="side-settings"><p class="side-label">設定</p><button id="themeToggle" class="utility" type="button">☾ ダークモード</button><div id="layoutControls" class="mode-switch" role="group" aria-label="表示レイアウト"></div></div>
</aside>
<main id="main"><div id="content"></div></main>
<footer>原子量は概数です。()内の数値は最も安定な同位体の質量数です。</footer>
<script>

function elementUses(e){

 const title=d?d[0]:synthetic?"超重元素の基礎研究":"科学研究・特殊材料";
 const use=d?d[1]:synthetic?"加速器などで少数の原子が合成され、原子核の性質を調べる研究に使われます。":"主に研究や特殊な材料分野で利用されます。";
 const everyday=d?d[2]:synthetic?"寿命が短く、日用品には使われていません。":"身近な製品では直接見かける機会は少ない元素です。";
 return '<section class="element-uses" aria-label="元素の用途"><div class="uses-heading"><span class="meta">ELEMENTS IN EVERYDAY LIFE</span><h2>どこで使われている？</h2></div><div class="uses-grid"><article class="uses-card"><span class="uses-icon">⚙️</span><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(use)+'</p></article><article class="uses-card"><span class="uses-icon">🏠</span><h3>身近なもの</h3><p>'+escapeHtml(everyday)+'</p></article></div><p class="uses-notice">※ 用途には元素そのものだけでなく、その元素を含む化合物・合金の利用も含みます。製品によって材料は異なります。</p></section>';
}

 '<div class="term-categories" role="group" aria-label="用語カテゴリ">'+groups.map(c=>'<button type="button" data-term-cat="'+escapeHtml(c)+'" aria-pressed="'+(termCategory===c)+'">'+(c==="all"?"すべて":escapeHtml(c))+' <small>'+ (c==="all"?all.length:all.filter(t=>t.category===c).length)+'</small></button>').join("")+'</div>'+

}

 if(tab=="rs")return focusedList(researcherRows(),"person",a=>`<article class="item researcher-card"><details class="entry-details" ${focusItem?.kind==="person"&&focusItem.name===a[0]?"open":""}><summary><strong>${escapeHtml(a[0])}</strong><span class="entry-chevron" aria-hidden="true">⌄</span></summary><div class="entry-body"><p class="meta">${escapeHtml(a[1])}・${escapeHtml(a[2])}</p><p>${escapeHtml(a[3])}</p><div class="researcher-relations"><h4>関連する内容</h4>${researcherRelations(a[0])}</div></div></details></article>`);
 return glossary()}
function draw(){stopLab();cancelAnimationFrame(atomRaf);tabs();$("content").innerHTML=view();if(tab=="lab")labInit();if(tab=="hl")hlUpdate();if(tab=="pt")atomStart()}
document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-term-back],[data-note-add],[data-note-save],[data-note-delete],[data-term-cat],[data-term-open],[data-go-kind],[data-focus-clear],[data-layout],[data-atom-toggle],[data-atom-reset],[data-t],[data-z],[data-c],[data-x],[data-e],[data-r],[data-h],[data-i],[data-p],[data-fav],[data-answer],[data-next],[data-restart]");
 if(!t)return;
 if(t.dataset.termBack!==undefined){termFocus=null;termSelected=null;draw();if(termReturnScroll!==null){const y=termReturnScroll;termReturnScroll=null;requestAnimationFrame(()=>window.scrollTo({top:y,behavior:"instant"}));}return}
 if(t.dataset.noteAdd!==undefined){stickyEditing=stickyEditing===t.dataset.noteAdd?null:t.dataset.noteAdd;draw();return}
 if(t.dataset.noteSave!==undefined){const name=t.dataset.noteSave;const value=$("stickyText")?.value||"";stickyNotes[name]={text:value,updated:Date.now()};if(saveSticky()){stickyEditing=null;draw()}return}
 if(t.dataset.noteDelete!==undefined){const name=t.dataset.noteDelete;if(confirm("「"+name+"」の付箋を削除しますか？")){delete stickyNotes[name];saveSticky();stickyEditing=null;draw()}return}
 if(t.dataset.termCat!==undefined){termFocus=null;termCategory=t.dataset.termCat;termSelected=null;draw();return}
 if(t.dataset.termOpen!==undefined){termSelected=termSelected===t.dataset.termOpen?null:t.dataset.termOpen;draw();return}
 if(t.dataset.goKind){goRelated(t.dataset.goKind,t.dataset.goName);return}
 if(t.dataset.focusClear!==undefined){focusItem=null;draw();return}
 if(t.dataset.layout){layoutMode=t.dataset.layout;localStorage.setItem("chemistry-layout",layoutMode);applyLayout();return}
 if(t.dataset.atomToggle!==undefined){atomRunning=!atomRunning;atomStart();const b=$("atomToggle");if(b)b.textContent=atomRunning?"⏸ 一時停止":"▶ 再生";return}
 if(t.dataset.atomReset!==undefined){atomTime=0;atomRunning=true;atomStart();const b=$("atomToggle");if(b)b.textContent="⏸ 一時停止";return}
 if(t.dataset.fav!==undefined){const z=+t.dataset.fav;if(favorites.has(z))favorites.delete(z);else favorites.add(z);localStorage.setItem("chemistry-favorites",JSON.stringify([...favorites]));draw();return}
 if(t.dataset.answer!==undefined){if(!quizAnswered){quizChoice=+t.dataset.answer;quizAnswered=true;if(quizChoice===QUIZ[quizIndex].c)quizScore++;draw()}return}
 if(t.dataset.next!==undefined){quizIndex++;quizAnswered=false;quizChoice=-1;draw();return}
 if(t.dataset.restart!==undefined){quizIndex=0;quizScore=0;quizAnswered=false;quizChoice=-1;draw();return}
 if(t.dataset.r!==undefined){labInit();return}
 if(t.dataset.h!==undefined){hsel=+t.dataset.h;draw();return}
 if(t.dataset.i){const j=ISO.findIndex(a=>a[0]==t.dataset.i&&a[2]);if(j>=0){hsel=j;tab="hl";draw();scrollTo(0,0)}return}
 if(t.dataset.p!==undefined){hlPlay();return}
 if(t.dataset.x){const i=EX.findIndex(a=>a.k==t.dataset.x);if(i>=0){cur=i;tab="lab";draw();scrollTo(0,0)}return}
 if(t.dataset.e!==undefined){cur=+t.dataset.e;draw();return}
 if(t.dataset.t){tab=t.dataset.t;focusItem=null;termFocus=null;closeMenu()}
 else if(t.dataset.z){sel=+t.dataset.z;atomTime=0}
 else if(t.dataset.c!==undefined){filt=filt===t.dataset.c?null:t.dataset.c}
 draw();
});
$("q").addEventListener("input",ev=>{q=ev.target.value.trim().toLowerCase();draw()});
const themeButton=$("themeToggle");
function themeLabel(){const dark=document.documentElement.dataset.theme==="dark";themeButton.textContent=dark?"☀ ライトモード":"☾ ダークモード";$("themeQuick").textContent=dark?"☀":"☾"}
const storedTheme=localStorage.getItem("chemistry-theme");if(storedTheme)document.documentElement.dataset.theme=storedTheme;
function toggleTheme(){const dark=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.dataset.theme=dark?"light":"dark";localStorage.setItem("chemistry-theme",document.documentElement.dataset.theme);themeLabel()}
themeButton.addEventListener("click",toggleTheme);
$("themeQuick").addEventListener("click",toggleTheme);

let menuOpen=false,menuPreviousFocus=null;
function openMenu(){
 if(menuOpen)return;menuOpen=true;menuPreviousFocus=document.activeElement;
 $("sideMenu").inert=false;$("sideMenu").setAttribute("aria-hidden","false");
 $("menuBackdrop").hidden=false;document.body.classList.add("menu-open");
 $("menuToggle").setAttribute("aria-expanded","true");$("menuToggle").setAttribute("aria-label","メニューを閉じる");
 $("menuClose").focus();
}
function closeMenu(){
 if(!menuOpen)return;menuOpen=false;document.body.classList.remove("menu-open");
 $("sideMenu").setAttribute("aria-hidden","true");$("sideMenu").inert=true;
 $("menuBackdrop").hidden=true;$("menuToggle").setAttribute("aria-expanded","false");
 $("menuToggle").setAttribute("aria-label","メニューを開く");
 if(menuPreviousFocus&&menuPreviousFocus.isConnected)menuPreviousFocus.focus();
}
$("menuToggle").addEventListener("click",()=>menuOpen?closeMenu():openMenu());
$("menuClose").addEventListener("click",closeMenu);
$("menuBackdrop").addEventListener("click",closeMenu);
document.addEventListener("keydown",ev=>{
 if(ev.key==="Escape"&&menuOpen){closeMenu();return}
 if(ev.key==="Tab"&&menuOpen){
  const items=[...$("sideMenu").querySelectorAll('button:not([disabled]),a[href],input:not([disabled])')];
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
  else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
 }
});

themeLabel();applyLayout();draw();
</script>
</body>
</html>
