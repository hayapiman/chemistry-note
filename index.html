*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:2rem;margin:0;letter-spacing:.04em}
.lead{margin:2px 0 14px;color:var(--sub);font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex:1 1 320px}
.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;color:var(--sub);cursor:pointer}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font:inherit;font-size:.8rem;border:2px solid transparent;border-radius:99px;padding:2px 10px;cursor:pointer;color:var(--ink);background:hsl(var(--h) 65% var(--cl))}
.chip[aria-pressed=true]{border-color:var(--ink)}
.scroll{overflow-x:auto;padding-bottom:8px}

.card{grid-column:3/13;grid-row:1/4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;gap:16px;align-items:center;min-height:0}
.card .sym{font-family:"Shippori Mincho",serif;font-size:3.6rem;line-height:1;min-width:92px;text-align:center;border-radius:8px;padding:8px 4px;background:hsl(var(--h) 65% var(--cl))}
.card h2{margin:0;font-size:1.25rem}
.card p{margin:2px 0;font-size:.85rem;color:var(--sub)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.item h3{margin:0 0 2px;font-size:1.05rem}
.item .meta{font-size:.8rem;color:var(--sub);margin:0 0 6px}
.item p{margin:4px 0 0;font-size:.92rem;max-width:42em}
.eq{font-family:"Shippori Mincho",serif;font-size:1.25rem;margin:6px 0;overflow-x:auto;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;border-radius:99px;padding:0 9px;background:hsl(var(--h) 65% var(--cl));margin-right:6px}
.empty{color:var(--sub);padding:24px 0}
footer{max-width:1100px;margin:24px auto;padding:0 16px;color:var(--sub);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s}}
.lab canvas{width:100%;height:auto;display:block;border-radius:10px;background:#0f1830}
.hr{display:grid;grid-template-columns:76px 1fr 120px;gap:8px;align-items:center;width:100%;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 0 4px;color:var(--ink);cursor:pointer;text-align:left}
.hr[aria-pressed=true]{border-color:var(--accent);border-width:2px}
.hb{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.hb i{display:block;height:100%}
.ht{font-size:.85rem;text-align:right;color:var(--sub)}
#hs{width:100%;margin:8px 0}
#dc{width:100%;max-width:400px;height:auto;display:block}

.quiz-option{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:13px;border-radius:12px;cursor:pointer}
.quiz-option:disabled{cursor:default;opacity:.8}.quiz-option.correct{border:2px solid #19a76c}.quiz-option.wrong{border:2px solid #e25c66}
.quiz-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:650px){header,main{padding-left:12px;padding-right:12px}.bar{align-items:stretch}.tabs{order:2;flex-basis:100%}.utility{order:0}input[type=search]{order:1}.quiz-options{grid-template-columns:1fr}.card{padding:8px}}
</style>
</head>

function hlUpdate(){const s=$("hs");if(!s)return;const n=+s.value,I=ISO[hsel],c=$("dc").getContext("2d"),d=Math.round(200*(1-.5**n));c.clearRect(0,0,400,60);RK.forEach((r,i)=>{c.fillStyle=r<d?"rgba(138,147,173,.35)":"#2f7bff";c.beginPath();c.arc(8+(i%40)*10,8+Math.floor(i/40)*10,3.5,0,6.3);c.fill()});$("hn").textContent=(n?n+"回分("+fmt(I[2]*n)+")経過":"開始時")+" → 未崩壊 "+(100*.5**n).toFixed(n<4?1:3)+"%"}
function hlPlay(){cancelAnimationFrame(raf2);const s=$("hs");if(matchMedia("(prefers-reduced-motion:reduce)").matches){s.value=4;hlUpdate();return}s.value=0;const step=()=>{s.value=+s.value+.04;hlUpdate();if(+s.value<8)raf2=requestAnimationFrame(step)};step()}
document.addEventListener("input",ev=>{if(ev.target.id=="hs")hlUpdate()});
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,k)=>{const x=rgb(a),y=rgb(b);return"rgb("+x.map((v,i)=>Math.round(v+(y[i]-v)*k)).join()+")"};
function stopLab(){cancelAnimationFrame(raf);cancelAnimationFrame(raf2)}
function lab(){const e=EX[cur];
 const chips=EX.map((a,i)=>[a,i]).filter(([a])=>hit(a.k,a.t)).map(([a,i])=>`<button class="chip" style="--h:215" aria-pressed="${i==cur}" data-e="${i}">${a.k} ${a.t}</button>`).join("");
 return `<div class="lab"><div class="legend">${chips}</div><canvas id="cv" width="640" height="320" role="img" aria-label="${e.t}のアニメーション"></canvas><div class="item" style="margin-top:12px"><h3>${e.k}｜${e.t}</h3><div class="eq">${e.eq}</div><p>${e.tx}</p><p><button class="chip" style="--h:215" data-r="1">もう一度見る</button></p></div></div>`}
function labInit(){stopLab();const cv=$("cv");if(!cv)return;const g=cv.getContext("2d"),e=EX[cur],R=Math.random;
 const sx=320,top=100,bot=290,L=235,Rt=405,sf=160;let t=0,P=[],C=[];
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 const add=o=>P.push(Object.assign({l:0,vx:0,vy:0},o));
 function frame(){t++;const k=Math.min(t/300,1),on=k<.9;
  g.globalCompositeOperation="source-over";g.globalAlpha=1;g.fillStyle="#0f1830";g.fillRect(0,0,640,320);
  const s0=e.sz||16,s=s0*(1-(e.sh||0)*k);let px=sx,py=e.ls?sf-3:215;
  if(e.ls){if(e.sink)py=sf+(bot-28-sf)*Math.min(k*4,1);else if(e.mv)px=sx+Math.sin(t*.06)*50*e.mv*(on?1:0)}
  if(e.gl){const gi=k<.85?Math.min(k*5,1):(1-k)/.15;const gr=g.createRadialGradient(px,py,0,px,py,170);gr.addColorStop(0,e.gl);gr.addColorStop(1,"rgba(0,0,0,0)");g.globalAlpha=Math.max(gi,0)*(e.sp?.55:.35);g.fillStyle=gr;g.fillRect(0,0,640,320);g.globalAlpha=1}
  if(e.ls){g.fillStyle=mix(e.ls[0],e.ls[1],k);g.globalAlpha=.6;g.fillRect(L+1,sf,Rt-L-2,bot-sf-1);g.globalAlpha=1;g.strokeStyle="rgba(255,255,255,.65)";g.lineWidth=3;g.beginPath();g.moveTo(L,top);g.lineTo(L,bot-12);g.quadraticCurveTo(L,bot,L+12,bot);g.lineTo(Rt-12,bot);g.quadraticCurveTo(Rt,bot,Rt,bot-12);g.lineTo(Rt,top);g.stroke()}
  if(e.pp){const ph=Math.min(k*36,24);g.globalAlpha=.95;g.fillStyle=e.pp;g.fillRect(L+2,bot-ph,Rt-L-4,ph);g.globalAlpha=1}
  if(!e.ls&&e.pc){g.strokeStyle="#6b7691";g.lineWidth=4;g.beginPath();g.moveTo(px,py+s*.7);g.lineTo(px,310);g.stroke()}
  if(e.rod){g.fillStyle=e.pc;g.fillRect(sx-4,top-10,8,bot-30-top+10)}else if(e.pc&&s>1){g.fillStyle=e.pc;g.beginPath();g.ellipse(px,py,s,s*.7,0,0,7);g.fill()}
  if(e.cr){if(on&&R()<.5&&C.length<400)C.push({x:sx+(R()-.5)*50,y:sf+R()*(bot-sf-30),a:R()*6.3,l:0});g.strokeStyle=e.cr;g.lineWidth=1.5;for(const c of C){c.l=Math.min(c.l+.3,16);g.beginPath();g.moveTo(c.x,c.y);g.lineTo(c.x+Math.cos(c.a)*c.l,c.y+Math.sin(c.a)*c.l);g.stroke()}}
  if(e.pop){g.strokeStyle="rgba(255,255,255,.65)";g.lineWidth=3;g.strokeRect(sx-24,130,48,160);const d=t-90;
   if(d<0){g.fillStyle="#7ec8ff";for(let i=0;i<8;i++)g.fillRect(sx-18+((t*(1+i*.3)+i*17)%36),150+(i*17+t*.7*((i%3)+1))%120,3,3)}
   if(d==0)for(let i=0;i<50;i++)add({ty:"s",x:sx,y:210,vx:(R()-.5)*9,vy:-R()*7,m:40,r:1.8,c:"#bfe3ff"});
   if(d>=0&&d<40){g.globalCompositeOperation="lighter";const gr=g.createRadialGradient(sx,210,0,sx,210,20+d*8);gr.addColorStop(0,"#ffffff");gr.addColorStop(1,"rgba(0,0,0,0)");g.globalAlpha=1-d/40;g.fillStyle=gr;g.fillRect(0,0,640,320);g.globalAlpha=1;g.globalCompositeOperation="source-over";g.font="700 44px sans-serif";g.fillStyle="#fff";g.textAlign="center";g.fillText("ポン!",sx,90)}}
  if(on){
   if(e.fl)for(let i=0;i<3;i++)add({ty:"f",x:px+(R()-.5)*8,y:py,vx:(R()-.5)*.8,vy:-1.2-R()*1.5*e.fl[1],m:28,r:(7+R()*5)*e.fl[1],c:e.fl[0]});
   if(e.bub)for(let i=0;i<2;i++)if(R()<e.bub)add({ty:"b",x:px+(R()-.5)*16,y:py,vx:(R()-.5)*.4,vy:-.8-R(),m:200,r:2+R()*3});
   if(e.sp)for(let i=0;i<e.sp[1]*2;i++)add({ty:"s",x:px,y:py,vx:(R()-.5)*7,vy:-R()*6-1,m:45,r:1.6,c:e.sp[0]});
   if(e.pp&&R()<.6)add({ty:"p",x:L+10+R()*(Rt-L-20),y:sf+2,vy:.6+R()*.6,m:300,r:2,c:e.pp})}
  g.globalCompositeOperation="lighter";
  P=P.filter(p=>{p.l++;p.x+=p.vx;p.y+=p.vy;if(p.ty=="s")p.vy+=.18;if(p.ty=="f")p.r*=.96;
   if((p.ty=="b"&&p.y<sf-4)||p.l>p.m||(p.ty=="p"&&p.y>bot-8))return false;
   g.globalAlpha=Math.max(1-p.l/p.m,0)*(p.ty=="f"?.55:1);
   if(p.ty=="b"){g.strokeStyle="#cfe9ff";g.lineWidth=1.2;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.stroke()}
   else{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}
   return true});
  g.globalAlpha=1;g.globalCompositeOperation="source-over";
  if(t<360&&!still)raf=requestAnimationFrame(frame)}
 if(still)t=220;
 frame()}
const QUIZ=[
 {q:"水の化学式は？",a:["H₂O","CO₂","O₂","NaCl"],c:0,why:"水は水素2個と酸素1個からなる分子です。"},
 {q:"原子番号26の元素は？",a:["銅","鉄","銀","亜鉛"],c:1,why:"鉄（Fe）の原子番号は26です。"},
 {q:"空気中で最も多い気体は？",a:["酸素","二酸化炭素","窒素","アルゴン"],c:2,why:"窒素は空気の約78%を占めます。"},
 {q:"中性の水溶液のpHはおよそ？",a:["1","7","10","14"],c:1,why:"25℃では中性の水溶液のpHは約7です。"},
 {q:"食塩の化学式は？",a:["HCl","KCl","NaCl","NaOH"],c:2,why:"食塩の主成分は塩化ナトリウム（NaCl）です。"},
 {q:"炭素の元素記号は？",a:["Ca","C","Co","Cu"],c:1,why:"炭素の元素記号はCです。"},
 {q:"半減期を1回経過すると未崩壊の原子核は？",a:["0%","25%","50%","75%"],c:2,why:"半減期ごとに未崩壊の原子核は半分になります。"},
 {q:"酸と塩基の中和で一般に生じるものは？",a:["塩と水","酸素だけ","水素だけ","炭素"],c:0,why:"代表的な中和反応では塩と水が生じます。"}
];
function quiz(){const x=QUIZ[quizIndex%QUIZ.length];return `<section class="item"><div class="quiz-head"><h2>学習クイズ</h2><span class="meta">${quizIndex+1} / ${QUIZ.length} 問・正解 ${quizScore}</span></div><h3>${x.q}</h3><div class="quiz-options">${x.a.map((a,i)=>`<button class="quiz-option ${quizAnswered?(i===x.c?"correct":i===quizChoice?"wrong":""):""}" data-answer="${i}" ${quizAnswered?"disabled":""}>${i+1}. ${a}</button>`).join("")}</div>${quizAnswered?`<p><strong>${quizChoice===x.c?"正解！":"惜しい！"}</strong> ${x.why}</p><button class="utility" data-next="1">${quizIndex===QUIZ.length-1?"結果を見る":"次の問題へ →"}</button>`:"<p class=meta>選択肢を選んで回答してください。</p>"}</section>`}
function quizResult(){return `<section class="item"><h2>クイズ結果</h2><p style="font-size:2rem"><strong>${quizScore} / ${QUIZ.length}</strong> 正解</p><p>繰り返し挑戦して、化学の知識を定着させましょう。</p><button class="utility" data-restart="1">もう一度挑戦</button></section>`}
function view(){
 if(tab=="quiz")return quizIndex>=QUIZ.length?quizResult():quiz();
 if(tab=="lab")return lab();
 if(tab=="hl")return hl();
 if(tab=="pt")return pt();
 if(tab=="rx")return list(RX,a=>`<article class="item"><h3>${a[0]}</h3><p class="meta"><span class="tag" style="--h:215">${a[1]}</span></p><div class="eq">${a[2]}</div><p>${a[3]}</p></article>`,q);
 if(tab=="rs")return list(RS,a=>`<article class="item"><h3>${a[0]}</h3><p class="meta">${a[1]}・${a[2]}</p><p>${a[3]}</p></article>`,q);
 return list(GL,a=>`<article class="item"><h3>${a[0]}</h3><p>${a[1]}</p></article>`,q)}
function draw(){stopLab();tabs();$("main").innerHTML=view();if(tab=="lab")labInit();if(tab=="hl")hlUpdate()}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-t],[data-z],[data-c],[data-x],[data-e],[data-r],[data-h],[data-i],[data-p],[data-fav],[data-answer],[data-next],[data-restart]");if(!t)return;
 if(t.dataset.r){labInit();return}
 if(t.dataset.h!==undefined){hsel=+t.dataset.h;draw();return}
 if(t.dataset.i){const j=ISO.findIndex(a=>a[0]==t.dataset.i&&a[2]);if(j>=0){hsel=j;tab="hl";draw();scrollTo(0,0)}return}
 if(t.dataset.p){hlPlay();return}
 if(t.dataset.x){const i=EX.findIndex(a=>a.k==t.dataset.x);if(i>=0){cur=i;tab="lab";draw();scrollTo(0,0)}return}
 if(t.dataset.e!==undefined){cur=+t.dataset.e;draw();return}
 if(t.dataset.t){tab=t.dataset.t}
 else if(t.dataset.z){sel=+t.dataset.z}
 else filt=filt==t.dataset.c?null:t.dataset.c;
 draw()});
$("q").addEventListener("input",ev=>{q=ev.target.value.trim().toLowerCase();draw()});

const storedTheme=localStorage.getItem("chemistry-theme");if(storedTheme)document.documentElement.dataset.theme=storedTheme;
